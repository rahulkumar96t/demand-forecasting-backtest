[project]
name = "demand-forecasting-backtest"
version = "0.1.0"
description = "Retail demand forecasting with a rolling-origin backtest: baselines, Holt-Winters and a global gradient-boosting model, scored with MASE, sMAPE, bias and interval coverage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "statsmodels>=0.14.4",
    "threadpoolctl>=3.5",
]

[project.scripts]
demand-forecast = "demand_forecast.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "demand_forecast"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.format]
quote-style = "double"
